name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Run the canonical CI entrypoint across the three GitHub-hosted OSes.
    # fail-fast: false so one OS failing still surfaces results for the others.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Windows is exercised but advisory: scripts/ci.sh / dogfood.sh invoke
        # the built binary as ./zig-out/bin/zentinel, while on Windows the
        # artifact is zentinel.exe. Git Bash usually resolves the .exe suffix,
        # but that is not guaranteed and cannot be validated here without a
        # build, so the Windows leg is non-blocking. ubuntu + macOS stay hard
        # required.
        include:
          - os: windows-latest
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # docs/ZIG_VERSION_POLICY.md: CI prints the resolved Zig version so an
      # unsupported toolchain is visible up front, before the build/test stages.
      - name: Print Zig version
        run: zig version

      # Canonical in-repository CI entrypoint: format_check, build, unit_tests,
      # advisory_dogfood (see docs/CI_STRATEGY.md). Network-independent.
      # scripts/ci.sh is bash; force shell: bash so it runs on the Windows
      # runner (whose default shell is PowerShell) alongside ubuntu and macOS.
      - name: Run CI
        shell: bash
        run: scripts/ci.sh

  target-zig-matrix:
    # ADR-0010: zentinel builds with its native Zig (0.16.0) and mutation-tests
    # projects on any supported target Zig (stable 0.13.x through 0.16.x). Build
    # once natively, then make the target toolchain the active `zig` and run the
    # end-to-end matrix against it (latest patch of each supported minor).
    # Actions in this job are pinned to full commit SHAs (tag in the comment).
    strategy:
      fail-fast: false
      matrix:
        target: ["0.13.0", "0.14.1", "0.15.2", "0.16.0"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install native Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Build zentinel with the native toolchain
        run: zig build

      - name: Install target Zig ${{ matrix.target }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.target }}
          use-cache: false

      - name: Print active (target) Zig version
        run: zig version

      - name: End-to-end against the target toolchain
        env:
          TARGET_ZIG: ${{ matrix.target }}
          ZENTINEL_BIN: ${{ github.workspace }}/zig-out/bin/zentinel
        run: scripts/e2e-zig-matrix.sh "$TARGET_ZIG"
